<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>MonsterVPN — email</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b1020;color:#eef2ff}
.wrap{width:min(480px,92vw);margin:0 auto;padding:72px 0}
label{display:block;margin:16px 0 6px;color:#9aa6c8}
input{width:100%;padding:12px;border-radius:8px;border:1px solid #2a3350;background:#121a30;color:#fff;box-sizing:border-box}
button{width:100%;margin-top:22px;background:#e5322d;color:#fff;border:0;padding:14px;border-radius:10px;font-weight:800}
</style>
</head>
<body>
<div class="wrap">
  <h1>Create account</h1>
  <form action="thanks.html" method="get">
    <label>Email</label>
    <input type="email" name="email" required/>
    <button type="submit">Continue</button>
  </form>
</div>
</body>
</html>
